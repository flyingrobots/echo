name: Experimental Keep contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    name: Echo–Keep experimental conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path experiments/echo-keep/Cargo.toml --locked
      - run: cargo clippy --manifest-path experiments/echo-keep/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fmt --manifest-path experiments/echo-keep/Cargo.toml -- --check
      - name: Verify dependency-tree failure handling
        run: bash scripts/tests/keep_dependency_boundary_test.sh
      - name: Preserve the default CAS toolchain and dependency boundary
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 check --locked -p echo-cas
          dependency_tree=$(cargo tree --locked -p echo-cas)
          if grep -q "keep v" <<< "$dependency_tree"; then exit 1; fi

  dependency-policy:
    name: Experimental Keep dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify scoped source policy
        run: |
          python3 scripts/keep_deny_policy.py .echo-keep-deny.toml
          python3 scripts/tests/keep_deny_policy_test.py
      - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          manifest-path: experiments/echo-keep/Cargo.toml
          rust-version: "1.96.0"
          arguments: --locked --all-features
          command-arguments: --config /github/workspace/.echo-keep-deny.toml
      - name: Remove generated policy
        if: always()
        run: rm -f .echo-keep-deny.toml
