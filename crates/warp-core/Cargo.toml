[package]
name = "warp-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.96.0"
description = "Echo core: deterministic typed graph rewriting engine"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/echo"
readme = "README.md"
keywords = ["echo", "ecs", "deterministic", "graph"]
categories = ["game-engines", "data-structures"]
build = "build.rs"

[dependencies]
blake3 = "1.0"
bytemuck = { version = "1.14", features = ["derive", "extern_crate_std"] }
bytes = "1.0"
thiserror = "1.0"
hex = "0.4"
rustc-hash = "2.1.1"
sha2 = "0.10"
echo-wasm-abi = { workspace = true }
echo-runtime-schema = { workspace = true }
echo-registry-api = { workspace = true }
echo-edict-canonical = { workspace = true }
warp-math = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"

[dev-dependencies]
proptest = { version = "1.5" }
echo-dry-tests = { workspace = true }
echo-cas = { workspace = true }

[features]
default = []
# INTERNAL ONLY: exposes native Rust rule authoring seams for Echo's own
# bootstrap fixtures, tests, and benchmarks. This is not the public authoring
# path for application rewrites.
native_rule_bootstrap = []
# INTERNAL ONLY: exposes host/test fixture seams for Echo-owned admission
# evidence. Downstream application crates must not enable this feature.
host_test = []
# EXPERIMENTAL (M1): keep an incremental application root beside the legacy
# state root, in shadow mode. It changes no root, receipt or wire format.
application_root_shadow = []
# TRUSTED HOST ONLY: exposes runtime-owner authority constructors for host
# adapters that own scheduler/runtime control. Application crates must not
# enable this feature.
trusted_runtime = []

# Scalar backend lanes (CI/test orchestration).
# - `det_float`: default float32-backed lane using `F32Scalar`.
# - `det_fixed`: fixed-point Q32.32 lane using `DFix64` (experimental, test-only).
det_float = ["warp-math/det_float"]
det_fixed = ["warp-math/det_fixed"]

# Validation feature for delta operations
delta_validate = []

# Enable footprint enforcement in release builds (normally debug-only).
# Use in CI or staging to catch footprint violations before production.
# Mutually exclusive with `unsafe_graph` (compile error if both enabled).
footprint_enforce_release = []

# DANGER: Disables footprint enforcement entirely, even in debug builds.
# Only use if you've proven enforcement overhead is unacceptable in a
# specific hot path. Removes all determinism safety checks.
# Mutually exclusive with `footprint_enforce_release`.
unsafe_graph = []

# Action-path benchmarks. They drive a trusted host through its public calls,
# so they live in this crate, which already has every dependency they need;
# adding those to `warp-benches` would change `Cargo.lock`, which the provider
# package binds. Each prints a table; none uses a benchmark harness.
[[bench]]
name = "action_footprint_overlap"
harness = false
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[bench]]
name = "scene_fixtures"
harness = false
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[bench]]
name = "wal_record_cost"
harness = false
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "parallel_parallel_exec"
required-features = ["delta_validate"]

[[test]]
name = "causal_fact_publication_tests"
required-features = ["host_test"]

[[test]]
name = "causal_wal_hardening_tests"
required-features = ["host_test"]

[[test]]
name = "optic_invocation_admission_tests"
required-features = ["host_test"]

[[test]]
name = "admission_comparison_tests"
required-features = ["host_test"]

[[test]]
name = "scheduler_fault_recovery_authority"
required-features = ["trusted_runtime"]

[[test]]
name = "installed_contract_registry_tests"
required-features = ["native_rule_bootstrap"]

[[test]]
name = "commit_touch_log"
required-features = ["native_rule_bootstrap"]

[[test]]
name = "installed_contract_intent_pipeline_tests"
required-features = ["native_rule_bootstrap", "host_test"]

[[test]]
name = "provider_contract_admission_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "executable_operation_pipeline_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "edict_projected_cas_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "edict_pure_evaluation_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_pure_predicates_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_byte_literal_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_unsigned_addition_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_pure_unsigned_subtraction_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_pure_byte_length_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_byte_equality_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_byte_slice_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_node_read_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_effect_range_reads"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_effect_frame_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_effect_read_image_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_byte_concat_tests"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_source_functions_tests"
required-features = ["trusted_runtime"]

[build-dependencies]
blake3 = "1.0"

[lints]
workspace = true

# A test file whose whole body sits behind an inner `#![cfg(feature = ...)]`
# must also declare `required-features` here. Without it, `cargo test -p
# warp-core` compiles an empty target and reports "running 0 tests ... ok",
# a green that ran nothing. With it, cargo skips the target outright.
# `scripts/check-feature-gated-tests.py` enforces this, and that CI runs each
# such target with its features (#867).

[[test]]
name = "causal_anchor_external_consumer_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "external_consumer_contract_fixture_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "trusted_runtime_host_loop_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "scene_fixture_tests"
required-features = ["native_rule_bootstrap", "trusted_runtime"]

[[test]]
name = "parallel_engine_integration_multiwarp"
required-features = ["delta_validate"]

[[test]]
name = "parallel_merge_tripwire"
required-features = ["delta_validate"]

[[test]]
name = "parallel_merge_warpopkey"
required-features = ["delta_validate"]

[[test]]
name = "parallel_openportal_rules"
required-features = ["delta_validate"]

[[test]]
name = "parallel_stress_multiwarp"
required-features = ["delta_validate"]

[[test]]
name = "edict_effect_graph_schema_tests"
path = "tests/edict_effect_graph_schema_tests.rs"
required-features = ["trusted_runtime"]

[[test]]
name = "edict_effect_package_tests"
required-features = ["trusted_runtime"]
