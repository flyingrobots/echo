<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t">
  <!-- SPDX-License-Identifier: Apache-2.0 OR LicenseRef-MIND-UCAL-1.0 -->
  <!-- © James Ross Ω FLYING•ROBOTS <https://github.com/flyingrobots> -->
  <title id="t">WAL recovery pipeline: scan, validate, partition committed history from the uncommitted tail, rebuild indexes, emit a certificate</title>
  <style>
    .bg{fill:#0D1526}
    .plane{fill:#16223B;stroke:#2A3B5E;stroke-width:1.5}
    .stage{fill:#1E1A33;stroke:#4A3B73;stroke-width:1.5}
    .title{font:700 20px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8EEF9}
    .ptitle{font:700 14px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8EEF9}
    .txt{font:13px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8EEF9}
    .sub{font:11.5px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#93A5C4}
    .mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E8EEF9}
    .monosm{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#93A5C4}
    .chip{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="aP4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BE0"/></marker>
    <marker id="aG4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57C793"/></marker>
    <marker id="aR4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5605A"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text class="title" x="40" y="36">Recovery — from raw segment bytes to certified history</text>

  <!-- stage row -->
  <rect class="stage" x="40" y="70" width="250" height="88" rx="10"/>
  <text class="ptitle" x="56" y="96" fill="#A78BE0">1 · Scan segments</text>
  <text class="sub" x="56" y="118">disk-record magic + per-record</text>
  <text class="sub" x="56" y="134">BLAKE3 digest check; EOF mid-record</text>
  <text class="sub" x="56" y="150">⇒ torn tail, not an error</text>

  <rect class="stage" x="330" y="70" width="250" height="88" rx="10"/>
  <text class="ptitle" x="346" y="96" fill="#A78BE0">2 · Validate frames</text>
  <text class="sub" x="346" y="118">header + frame checksums,</text>
  <text class="sub" x="346" y="134">payload digest match,</text>
  <text class="sub" x="346" y="150">strict LSN continuity (no gaps)</text>

  <rect class="stage" x="620" y="70" width="250" height="88" rx="10"/>
  <text class="ptitle" x="636" y="96" fill="#A78BE0">3 · Validate commits</text>
  <text class="sub" x="636" y="118">records_root · tx semantics ·</text>
  <text class="sub" x="636" y="134">affected_frontiers_root ·</text>
  <text class="sub" x="636" y="150">commit_digest re-derived</text>

  <rect class="stage" x="910" y="70" width="250" height="88" rx="10"/>
  <text class="ptitle" x="926" y="96" fill="#A78BE0">4 · Partition</text>
  <text class="sub" x="926" y="118">every frame ≤ last commit’s LSN</text>
  <text class="sub" x="926" y="134">is history; everything after it</text>
  <text class="sub" x="926" y="150">is tail</text>

  <path d="M290 114 L330 114" fill="none" stroke="#A78BE0" stroke-width="1.8" marker-end="url(#aP4)"/>
  <path d="M580 114 L620 114" fill="none" stroke="#A78BE0" stroke-width="1.8" marker-end="url(#aP4)"/>
  <path d="M870 114 L910 114" fill="none" stroke="#A78BE0" stroke-width="1.8" marker-end="url(#aP4)"/>

  <!-- split -->
  <path d="M980 158 L700 220" fill="none" stroke="#57C793" stroke-width="1.8" marker-end="url(#aG4)"/>
  <path d="M1080 158 L1010 220" fill="none" stroke="#E5605A" stroke-width="1.8" marker-end="url(#aR4)"/>

  <rect x="440" y="224" width="420" height="64" fill="#122B22" stroke="#2C5C46" rx="10"/>
  <text class="txt" x="456" y="250" fill="#57C793" font-weight="700">Committed history</text>
  <text class="sub" x="456" y="272">ordered WalRecoveredTransaction list — the only input to index rebuild</text>

  <rect x="900" y="224" width="260" height="64" fill="#2E1A1C" stroke="#7A3A38" rx="10"/>
  <text class="txt" x="916" y="250" fill="#FF9B94" font-weight="700">Uncommitted tail</text>
  <text class="sub" x="916" y="272">frames past the last commit, or torn bytes</text>

  <!-- tail posture -->
  <rect class="plane" x="900" y="320" width="260" height="190" rx="10" stroke="#7A3A38"/>
  <text class="ptitle" x="916" y="346" fill="#FF9B94">Tail posture</text>
  <text class="mono" x="916" y="374" fill="#E8EEF9">read-only:</text>
  <text class="monosm" x="932" y="392" fill="#FF9B94">WouldTruncateAfter(lsn)</text>
  <text class="monosm" x="932" y="408" fill="#FF9B94">WouldTruncateAll</text>
  <text class="mono" x="916" y="436" fill="#E8EEF9">writable:</text>
  <text class="monosm" x="932" y="454" fill="#FF9B94">TruncatedAfter(lsn)</text>
  <text class="monosm" x="932" y="470" fill="#FF9B94">TruncatedAll</text>
  <text class="sub" x="916" y="494">writable mode rewrites the segments</text>
  <path d="M1030 288 L1030 320" fill="none" stroke="#E5605A" stroke-width="1.6" marker-end="url(#aR4)"/>

  <!-- index rebuild -->
  <rect class="plane" x="40" y="320" width="500" height="190" rx="10" stroke="#4A3B73"/>
  <text class="ptitle" x="56" y="346" fill="#A78BE0">5 · Rebuild durability indexes</text>
  <text class="sub" x="56" y="366">pure fold over committed payloads — no callbacks, no clock, no I/O</text>
  <g>
    <rect x="56" y="382" width="150" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="70" y="401" fill="#E8EEF9">submissions</text>
    <rect x="216" y="382" width="200" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="230" y="401" fill="#E8EEF9">receipts / correlation</text>
    <rect x="56" y="422" width="150" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="70" y="441" fill="#E8EEF9">retention</text>
    <rect x="216" y="422" width="140" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="230" y="441" fill="#E8EEF9">topology</text>
    <rect x="366" y="422" width="150" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="380" y="441" fill="#E8EEF9">outbox replay</text>
    <rect x="56" y="462" width="230" height="30" rx="15" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="70" y="481" fill="#E8EEF9">checkpoint publications</text>
  </g>
  <path d="M650 288 L290 320" fill="none" stroke="#57C793" stroke-width="1.8" marker-end="url(#aG4)"/>

  <!-- certificate -->
  <rect class="plane" x="580" y="320" width="280" height="190" rx="10" stroke="#2C5C46"/>
  <text class="ptitle" x="596" y="346" fill="#57C793">6 · Recovery certificate</text>
  <text class="monosm" x="596" y="372" fill="#E8EEF9">checkpoint_used?</text>
  <text class="monosm" x="596" y="390" fill="#E8EEF9">first_lsn ‥ last_lsn</text>
  <text class="monosm" x="596" y="408" fill="#E8EEF9">committed_transactions_replayed</text>
  <text class="monosm" x="596" y="426" fill="#E8EEF9">tail_posture · obstruction_count</text>
  <text class="monosm" x="596" y="444" fill="#E8EEF9">recovered_frontier_root</text>
  <text class="monosm" x="596" y="462" fill="#E8EEF9">recovered_indexes_root</text>
  <text class="sub" x="596" y="490">a signed-shape claim of exactly what</text>
  <text class="sub" x="596" y="504">recovery saw and rebuilt</text>
  <path d="M540 415 L580 415" fill="none" stroke="#A78BE0" stroke-width="1.8" marker-end="url(#aP4)"/>

  <!-- posture strip -->
  <rect class="plane" x="40" y="552" width="1120" height="108" rx="10"/>
  <text class="ptitle" x="56" y="580">Recovered submission posture (what an application learns after restart)</text>
  <g>
    <rect x="56"  y="598" width="130" height="34" rx="17" fill="#1C2B4A" stroke="#334770"/><text class="chip" x="74"  y="620" fill="#93A5C4">NotAccepted</text>
    <rect x="196" y="598" width="160" height="34" rx="17" fill="#2B2413" stroke="#5C4E23"/><text class="chip" x="214" y="620" fill="#E8B84B">AcceptedPending</text>
    <rect x="366" y="598" width="150" height="34" rx="17" fill="#122B22" stroke="#2C5C46"/><text class="chip" x="384" y="620" fill="#57C793">DecidedApplied</text>
    <rect x="526" y="598" width="160" height="34" rx="17" fill="#122B22" stroke="#2C5C46"/><text class="chip" x="544" y="620" fill="#57C793">DecidedRejected</text>
    <rect x="696" y="598" width="130" height="34" rx="17" fill="#2E1A1C" stroke="#7A3A38"/><text class="chip" x="714" y="620" fill="#FF9B94">Obstructed</text>
    <rect x="836" y="598" width="170" height="34" rx="17" fill="#2E1A1C" stroke="#7A3A38"/><text class="chip" x="854" y="620" fill="#FF9B94">RecoveryFaulted</text>
  </g>
  <text class="sub" x="56" y="650">Recovery never invents half-accepted submissions, half-ticks, or uncorrelatable receipts — a fact is one of these, or it is not a fact.</text>
</svg>
