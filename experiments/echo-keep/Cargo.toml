[package]
name = "echo-keep-experimental"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
license = "Apache-2.0"
description = "Experimental identity conformance for Echo and Keep"

# A separate workspace keeps Keep out of Echo default dependency resolution.
[workspace]

[dependencies]
echo-cas = { version = "0.1.0", path = "../../crates/echo-cas" }
blake3 = "=1.8.5"
keep = { version = "=0.0.0", git = "https://github.com/flyingrobots/keep", rev = "3165890e9291cfb5fe10e81a9d7cd151f3e59464" }
thiserror = "2"
